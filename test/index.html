<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <title>Component Test</title>
  <link rel="icon" href="../assets/img/decorative/faviconFlower.png" type="image/png">
  <link rel="stylesheet" href="../assets/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div data-component="header"></div>
  <main class="content-stack">
    <h1 style="font-size: 14px; color: var(--gray); margin-bottom: 32px;">Component test page — /test</h1>

    <!-- Title -->
    <section class="test-section">
      <h2 style="font-size: 12px; color: var(--gray-light); margin-bottom: 16px; text-transform: uppercase;">Title</h2>
      <div data-component="title" data-text="Placeholder title copy for testing"></div>
    </section>

    <!-- Subtitle -->
    <section class="test-section">
      <h2 style="font-size: 12px; color: var(--gray-light); margin-bottom: 16px; text-transform: uppercase;">Subtitle</h2>
      <div data-component="subtitle" data-text="Placeholder subtitle copy for testing"></div>
    </section>

    <!-- Hero -->
    <section class="test-section">
      <h2 style="font-size: 12px; color: var(--gray-light); margin-bottom: 16px; text-transform: uppercase;">Hero</h2>
      <div data-component="hero" data-icon="hi-graphic.svg" data-title="Title" data-body="<p>Placeholder body text for testing. This is the default body/normal styling at 16px with comfortable line height for readability.</p>"></div>
    </section>

    <!-- Image -->
    <section class="test-section">
      <h2 style="font-size: 12px; color: var(--gray-light); margin-bottom: 16px; text-transform: uppercase;">Image</h2>
      <div data-component="image" data-src="Test1.png" data-alt="Test image 1" data-label="Test 1 — click to view enhanced"></div>
      <div data-component="image" data-src="Test2.png" data-alt="Test image 2" data-label="Test 2 — click to view enhanced"></div>
    </section>

    <!-- Text -->
    <section class="test-section">
      <h2 style="font-size: 12px; color: var(--gray-light); margin-bottom: 16px; text-transform: uppercase;">Text</h2>
      <div data-component="text">
        <p>Placeholder body text for testing. This is the default body/normal styling at 16px with comfortable line height for readability.</p>
      </div>
    </section>
  </main>
  <div data-component="footer"></div>
  <script src="../assets/components.js"></script>
</body>
</html>
